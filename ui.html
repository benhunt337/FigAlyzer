<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: #333;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100vh;
  }
  h2 { font-size: 16px; font-weight: 600; }
  p.desc { color: #666; line-height: 1.5; }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #18A0FB; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #0d8de6; }
  .btn-secondary { background: #e8e8e8; color: #333; }
  .btn-secondary:hover:not(:disabled) { background: #d8d8d8; }
  .actions { display: flex; gap: 8px; }
  #status {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    border-radius: 6px;
    background: #f5f5f5;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #status.error { background: #fdecea; color: #b71c1c; }
  #status.success { background: #e8f5e9; color: #1b5e20; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #ccc;
    border-top-color: #18A0FB;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<h2>FigAlyzer</h2>
<p class="desc">Select layers in Figma, then click <strong>Analyze</strong> to restructure them with AI — auto layout, semantic naming, and proper grouping for vibe coding.</p>

<div class="actions">
  <button id="analyze" class="btn-primary">Analyze Selection</button>
  <button id="cancel" class="btn-secondary">Close</button>
</div>

<div id="status">Ready. Select one or more layers and click Analyze.</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────
const PROXY_URL = "https://figalyzer.vercel.app/api/claude-proxy";

const SYSTEM_PROMPT = `You are an expert Figma design systems engineer. You receive a serialized Figma node tree (JSON) and return restructuring instructions that make the design clean, well-organized, and ready for MCP-based vibe coding tools (Cursor, Lovable, v0, Bolt).

Your goals:
1. **Semantic renaming** — Replace generic names (Frame 1, Group 3, Rectangle 12) with PascalCase semantic names that map to React components, CSS classes, and HTML elements (e.g. NavBar, HeroSection, CardContainer, InputGroup, SubmitButton).
2. **Logical grouping** — Wrap related sibling elements into new auto layout frames where they clearly form a logical unit (e.g. a label + input, an icon + text, a row of cards).
3. **Auto layout** — Apply HORIZONTAL or VERTICAL auto layout to frames that contain children in row or column arrangements. Infer direction from children positions. Set itemSpacing from the most common gap between children. Set padding from the distance between container edges and outermost children.
4. **Reorder** — If children are out of visual order relative to their layout direction, reorder them.
5. **Absolute positioning** — For overlapping decorative elements (badges, floating buttons) that should not participate in auto layout flow, use the setAbsolute operation.

Return ONLY a JSON array of operations. No markdown, no explanation, no code fences. The array must be valid JSON.

Available operations:

{ "op": "rename", "nodeId": "<id>", "name": "<NewName>" }

{ "op": "applyAutoLayout", "nodeId": "<id>", "layoutMode": "HORIZONTAL" | "VERTICAL", "itemSpacing": <number>, "paddingLeft": <n>, "paddingRight": <n>, "paddingTop": <n>, "paddingBottom": <n>, "primaryAxisAlignItems": "MIN"|"CENTER"|"MAX"|"SPACE_BETWEEN", "counterAxisAlignItems": "MIN"|"CENTER"|"MAX" }

{ "op": "createFrame", "parentId": "<id>", "childIds": ["<id>", ...], "name": "<GroupName>", "layoutMode": "HORIZONTAL"|"VERTICAL", "itemSpacing": <n>, "paddingLeft": <n>, "paddingRight": <n>, "paddingTop": <n>, "paddingBottom": <n> }

{ "op": "reorder", "parentId": "<id>", "childIds": ["<id>", "<id>", ...] }

{ "op": "setAbsolute", "nodeId": "<id>" }

Rules:
- Reference nodes by their "id" field from the input tree.
- Only include optional numeric fields (itemSpacing, padding) when you can infer reasonable values from positions.
- Apply createFrame BEFORE applyAutoLayout or rename ops that reference the same children, so the new frame exists first.
- Keep the array flat — no nesting.
- Be conservative: only restructure what clearly benefits from it. Do not break things that are already well-structured.`;

// ── State ──────────────────────────────────────────────────────────────
let pendingInstructions = null;
const statusEl = document.getElementById("status");
const analyzeBtn = document.getElementById("analyze");

function setStatus(text, className) {
  statusEl.textContent = text;
  statusEl.className = className || "";
}

// ── Button handlers ────────────────────────────────────────────────────
analyzeBtn.onclick = () => {
  setStatus("Reading selection...");
  analyzeBtn.disabled = true;
  parent.postMessage({ pluginMessage: { type: "analyze-selection" } }, "*");
};

document.getElementById("cancel").onclick = () => {
  parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
};

// ── Messages from main thread ──────────────────────────────────────────
window.onmessage = async (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === "analyze") {
    await callClaude(msg.data);
  }

  if (msg.type === "error") {
    setStatus(msg.message, "error");
    analyzeBtn.disabled = false;
  }

  if (msg.type === "apply-complete") {
    setStatus("Done! Applied " + msg.count + " operations.\nRun again on another selection, or close.", "success");
    analyzeBtn.disabled = false;
    pendingInstructions = null;
  }
};

// ── Claude call ────────────────────────────────────────────────────────
async function callClaude(treeData) {
  statusEl.className = "";
  statusEl.innerHTML = '<div><span class="spinner"></span> Analyzing design with Claude...</div>';

  try {
    const payload = {
      model: "claude-sonnet-4-20250514",
      max_tokens: 8192,
      system: SYSTEM_PROMPT,
      messages: [
        {
          role: "user",
          content: "Here is the serialized Figma node tree. Return restructuring instructions as a JSON array.\n\n" + JSON.stringify(treeData),
        },
      ],
    };

    const res = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error("Proxy returned " + res.status + ": " + errText);
    }

    const data = await res.json();

    if (data.error) {
      throw new Error(data.error.message || JSON.stringify(data.error));
    }

    const content = data.content && data.content[0] && data.content[0].text;
    if (!content) throw new Error("Empty response from Claude");

    const instructions = parseInstructions(content);
    if (!instructions || instructions.length === 0) {
      setStatus("Claude returned no restructuring operations. The design may already be well-structured.", "success");
      analyzeBtn.disabled = false;
      return;
    }

    pendingInstructions = instructions;
    setStatus("Claude suggested " + instructions.length + " operations. Applying...");

    parent.postMessage({ pluginMessage: { type: "apply", instructions } }, "*");

  } catch (err) {
    setStatus("Error: " + err.message, "error");
    analyzeBtn.disabled = false;
  }
}

function parseInstructions(text) {
  // Strip markdown code fences if Claude wrapped the JSON
  let cleaned = text.trim();
  if (cleaned.startsWith("```")) {
    cleaned = cleaned.replace(/^```(?:json)?\s*\n?/, "").replace(/\n?```\s*$/, "");
  }
  return JSON.parse(cleaned);
}
</script>
